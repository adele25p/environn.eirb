{{- /*
  back-to-top.html - Button to return to the top of the page.
*/ -}}
<button
  type="button"
  id="back-to-top"
  aria-label="Revenir en haut de la page"
  aria-hidden="true"
  tabindex="-1"
  class="pointer-events-none fixed right-5 bottom-5 z-40 inline-flex h-11 w-11 translate-y-2 items-center justify-center rounded-full bg-accent text-xl text-page opacity-0 shadow-lg transition-all hover:-translate-y-0.5 hover:brightness-95 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-accent"
>
  <span class="sr-only">Retour en haut</span>
  <span aria-hidden="true">↑</span>
</button>
