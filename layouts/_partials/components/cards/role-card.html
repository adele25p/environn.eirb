<div class="card card-page h-full p-6 sm:p-7">
  <div class="flex h-11 w-11 items-center justify-center rounded-2xl bg-accent/10">
    {{ partial "ui/icon.html" (dict "name" .icon "class" "h-5 w-5 text-accent") }}
  </div>
  <span class="mt-4 block text-xs tracking-wider text-subtle uppercase">{{ .tag }}</span>
  <h2 class="title-card">{{ .title }}</h2>
  <p class="mt-2 text-sm leading-relaxed text-subtle">{{ .desc }}</p>
</div>
